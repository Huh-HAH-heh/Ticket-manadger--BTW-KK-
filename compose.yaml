services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_db}
      POSTGRES_USER: ${POSTGRES_USER:-ticket_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Start-TicketManager-Docker.cmd to generate .env}
    volumes:
      - ticket_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ticket-manager-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TICKET_DB_CONNECTION: "Host=db;Port=5432;Database=${POSTGRES_DB:-ticket_db};Username=${POSTGRES_USER:-ticket_app};Password=${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}"
      TICKET_API_TOKEN_SECRET: ${TICKET_API_TOKEN_SECRET:?Missing TICKET_API_TOKEN_SECRET in .env}
      TICKET_BOOTSTRAP_KEY: ${TICKET_BOOTSTRAP_KEY:-}
      TICKET_DOCKER_ALLOW_PENDING_MODEL_CHANGES: "true"
    ports:
      - "127.0.0.1:${TICKET_API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticket-manager-internal

volumes:
  ticket_manager_postgres_data:
    name: ticket-manager-postgres-data

networks:
  ticket-manager-internal:
    name: ticket-manager-internal
    driver: bridge
